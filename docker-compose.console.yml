# podship console on the Mac Studio (Docker from Colima), deployed with
# podship itself (`podship deploy --env production`, see podship.yaml).
# Only nginx publishes a port, on loopback: the Cloudflare tunnel is the way in.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  server:
    build:
      context: .
      dockerfile: console/podship_console_server/Dockerfile
    image: podship-console-server:production
    restart: unless-stopped
    dns: [1.1.1.1, 1.0.0.1, 8.8.8.8]
    env_file:
      - path: .env
        required: true
    environment:
      CONSOLE_PUBLIC_URL: https://podship.densitylabs.io
      CONSOLE_API_URL: https://podship.densitylabs.io/rpc/
    volumes:
      - ./console/podship_console_server/config/passwords.yaml:/app/config/passwords.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8082/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging: *logging

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./console/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${PODSHIP_PORT_WEB:-8370}:8080"
    depends_on:
      - server
    logging: *logging

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: podship_console
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d podship_console"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

volumes:
  pgdata:
