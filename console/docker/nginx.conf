# The only door into the console. The tunnel sends podship.densitylabs.io here.
# /rpc/ is the Serverpod API; everything else is the web server (the app,
# /health, /.well-known/, /integrations/aws/callback, /podship/v1/).
server {
    listen 8080;
    client_max_body_size 1m;
    proxy_read_timeout 120s;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location /rpc/ {
        proxy_pass http://server:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /v1/websocket {
        proxy_pass http://server:8080/v1/websocket;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # Only reachable from inside the server container (podship_console_tool).
    location /internal/ {
        return 404;
    }

    location / {
        proxy_pass http://server:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
    }
}
