services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: podship_console
      POSTGRES_PASSWORD: "aXhgtBMiq47mYBBRLaJziTzweks-yl6W"
    volumes:
      - podship_console_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "YKmVxdvhyRma44wu5RiGY427QwTJsKmP"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: podship_console_test
      POSTGRES_PASSWORD: "H9txd6IsNMO532sg0VP-v_S1UMoDNRet"
    volumes:
      - podship_console_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "OY4T7KXRwYiERLObdJDm4A_3tldyQb_f"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  podship_console_data:
  podship_console_test_data:
