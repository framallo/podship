### A sign-in account: links an email address to an AuthUser.
class: EmailCodeAccount
serverOnly: true
table: email_code_account
fields:
  id: UuidValue?, defaultPersist=random_v7
  authUser: module:serverpod_auth_core:AuthUser?, relation(onDelete=Cascade)
  ### Lowercase email.
  email: String
  ### `es-MX` or `en`.
  locale: String, default='en'
  createdAt: DateTime, default=now
  lastLoginAt: DateTime?
indexes:
  email_code_account_email_idx:
    fields: email
    unique: true
