name: podship
description: Deploy, back up and roll back Serverpod projects on your own servers over SSH, with production and staging environments.
version: 0.1.0
repository: https://github.com/framallo/podship
issue_tracker: https://github.com/framallo/podship/issues
topics: [serverpod, deployment, docker, backup, cli]

environment:
  sdk: ^3.8.0

executables:
  podship: podship

dependencies:
  args: ^2.6.0
  bcrypt: ^1.2.0
  crypto: ^3.0.3
  path: ^1.9.0
  yaml: ^3.1.2
  yaml_edit: ^2.2.1

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
